name: Windows kurulum paketi
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'js/**', 'css/**', 'index.html', 'package*.json', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - name: Windows kurulum paketini üret
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $output = & npm run dist:win 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output "$_" }
          if ($code -ne 0) {
            $details = ($output | Select-Object -Last 25 | ForEach-Object { "$_" }) -join "`n"
            $annotation = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows paketleme hatası::$annotation"
          }
          exit $code
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Aybars-POS-Windows-Kurulum
          path: dist/Aybars-POS-Kurulum-*.exe
          if-no-files-found: error
